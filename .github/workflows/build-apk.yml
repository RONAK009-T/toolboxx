name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Native Android
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Build Android Standalone Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -Pandroid.enableMinifyInReleaseBuilds=false --no-daemon

      - name: Find and verify standalone APK
        run: |
          mkdir -p output
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          else
            APK_PATH=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          fi
          echo "Selected APK: $APK_PATH"
          cp "$APK_PATH" output/ToolBoxX.apk
          ls -lh output/ToolBoxX.apk
          echo "Verifying JavaScript bundle inside APK:"
          unzip -l output/ToolBoxX.apk | grep "assets/index.android.bundle"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToolBoxX-Android-APK
          path: output/ToolBoxX.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: ToolBox X v1.0.0
          body: |
            ## ToolBox X v1.0.0 (Android Standalone APK)
            Download and install ToolBox X for Android.
            - 30+ everyday utilities & calculators
            - Lossless Image Compressor & Resizer
            - PDF Tools & Converter
            - QR Scanner & Generator
            - 10 Mini-Games
            - 100% Offline-Ready Standalone Release
          files: output/ToolBoxX.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
